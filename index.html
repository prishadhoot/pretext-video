<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pretext.video — Turn Your Face into Living Typography</title>
    <meta name="description" content="Transform your webcam into a real-time text portrait. Your face and body revealed through flowing literature — Shakespeare, Dickens, Homer. Record and export as video. Pure browser, no server needed." />
    <link rel="canonical" href="https://pretext.video/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pretext.video/" />
    <meta property="og:title" content="pretext.video — Turn Your Face into Living Typography" />
    <meta property="og:description" content="Transform your webcam into a real-time text portrait. Your face revealed through flowing literature. Record and export as video." />
    <meta property="og:site_name" content="pretext.video" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="pretext.video — Turn Your Face into Living Typography" />
    <meta name="twitter:description" content="Transform your webcam into a real-time text portrait. Record and export as video. Pure browser, no server." />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "pretext.video",
      "url": "https://pretext.video",
      "description": "Transform your webcam into a real-time text portrait using Pretext text layout engine and MediaPipe face segmentation. Record and export as MP4 video.",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web Browser",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "browserRequirements": "Requires a modern browser with WebCodecs support (Chrome, Edge)"
    }
    </script>

    <!-- Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6GFGR93TLG"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6GFGR93TLG');
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
      </div>

      <div id="toolbar">
        <div class="toolbar-left">
          <h1>pretext.video</h1>
        </div>

        <div class="toolbar-center">
          <select id="mode-select" title="Mode">
            <option value="textface">Text Face</option>
            <option value="cutout">Cutout in Text</option>
          </select>

          <select id="text-select" title="Text"></select>

          <div class="range-wrap">
            <input type="range" id="font-size" min="4" max="24" value="8" step="1" title="Font size" />
            <span id="font-size-label">8</span>
          </div>
        </div>

        <div class="toolbar-right">
          <span id="status"></span>
          <button id="camera-btn" type="button">Camera</button>
          <button id="record-btn" type="button" disabled>Record</button>
        </div>
      </div>

      <div id="custom-text-wrap" style="display: none;">
        <textarea id="custom-text" placeholder="Enter your text here..."></textarea>
        <button id="custom-text-close" type="button" title="Close">&times;</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
